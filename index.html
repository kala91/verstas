<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teknologia Verstas</title>
    <link rel="stylesheet" href="./tyylit/laatikkotyyli.css">

</head>

<body>
    <header>
        <h1>Teknologia Verstas</h1>
    </header>
    <nav>
        <ul>
            <li><a href="#etusivu" data-file="etusivu.html">Etusivu</a></li>
            <li><a href="#portfolio" data-file="portfolio.html">Portfolio</a></li>
            <li><a href="#demot" data-file="demot.html">Demot</a></li>
            <li><a href="#minusta" data-file="minusta.html">Minusta</a></li>
        </ul>
    </nav>
    <div class="container">
        <!-- Varoitus jos käyttäjän selain ei käytä javascriptia-->
        <noscript>
            <p>Huom! Sivusto vaatii JavaScriptin toimiakseen kunnolla. Ole hyvä ja ota JavaScript käyttöön tai käy <a href="etusivu.html">tässä staattisessa versiossa</a>.</p>
        </noscript>
          
        <main id="content">
            <p>Ladataan sisältöä...</p>
        </main>
    </div>

    <footer>
        <p>&copy; 2024 Aleksi Höylän teknologiaverstas.</p>
    </footer>

    <script>
        // Funktio, joka hakee ulkoisen HTML-fragmentin ja sijoittaa sen #content elementtiin
        function loadContent(filename) {
        fetch(filename)
            .then(response => {
            if (!response.ok) {
                throw new Error('Verkkovirhe: ' + response.status);
            }
            return response.text();
            })
            .then(html => {
            document.getElementById('content').innerHTML = html;
            })
            .catch(error => {
            console.error('Sisällön latausvirhe:', error);
            });
        }
        
        // Event listener navigaation linkeille
        document.querySelectorAll('nav a').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault(); // estää oletustoiminnon
                const file = this.dataset.file; // haetaan ladattava tiedosto
                // Päivitetään URL-hashi vastaamaan tiedoston nimeä ilman .html -päätettä
                window.location.hash = file.replace('.html', '');
                loadContent(file);
            });
        });
    
        // Sivun latauksen yhteydessä tarkistetaan URL-hash ja ladataan vastaava sisältö
        window.addEventListener('load', () => {
            // Jos hash on asetettu, yritetään ladata siitä johdettu tiedosto
            const hash = window.location.hash.substring(1); // poistaa #-merkin
            if (hash) {
                loadContent(hash + '.html');
            } else {
                // Oletuksena ladataan etusivu
                loadContent('etusivu.html');
            }
        });
    </script>
</body>
</html>
