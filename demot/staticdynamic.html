<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teknologia Verstas</title>
    <link rel="stylesheet" href="./tyylit/laatikkotyyli.css">

</head>

<body>
    <header>
        <h1>Teknologia Verstas</h1>
    </header>
    <nav>
        <ul>
            <li><a href="#etusivu" data-file="etusivu.html">Etusivu</a></li>
            <li><a href="#portfolio" data-file="portfolio.html">Portfolio</a></li>
            <li><a href="#projektit" data-file="projektit.html">Projektit</a></li>
            <li><a href="#minusta" data-file="minusta.html">Minusta</a></li>
        </ul>
    </nav>
    <div class="container">
        <main id="content">
            <p>Ladataan sisältöä...</p>
        </main>
    </div>
    <footer>
        <p>&copy; 2024 Aleksi Höylän teknologiaverstas.</p>
    </footer>

    <script>
        // Funktio, joka hakee ulkoisen HTML-fragmentin ja sijoittaa sen #content elementtiin
        function loadContent(filename) {
        fetch(filename)
            .then(response => {
            if (!response.ok) {
                throw new Error('Verkkovirhe: ' + response.status);
            }
            return response.text();
            })
            .then(html => {
            document.getElementById('content').innerHTML = html;
            })
            .catch(error => {
            console.error('Sisällön latausvirhe:', error);
            });
        }
        
        // Lisätään event listener jokaiselle navigaation linkille
        document.querySelectorAll('nav a').forEach(link => {
        link.addEventListener('click', function(e) {
            e.preventDefault(); // estää oletustoiminnon (selaimen scrollauksen kohteeseen)
            const file = this.dataset.file; // haetaan data-file arvo
            loadContent(file); // kutsutaan loadContent-funktiota
        });
        });
        
        // Ladataan oletuksena esim. etusivu heti sivun latauksen yhteydessä
        loadContent('etusivu.html');
      </script>
</body>
</html>
